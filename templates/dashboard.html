{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6 flex justify-between items-center">
        <div>
            <span class="text-sm text-gray-500">Available credits</span>
            <div id="balance" class="text-3xl font-bold text-blue-600">-</div>
        </div>
        <button onclick="location.href='/account'" class="px-4 py-2 border border-blue-600 text-blue-600 rounded hover:bg-blue-50 transition">Recharge</button>
    </div>

    <div class="bg-white rounded-lg shadow p-6" x-data="{url:'',loading:false}">
        <h3 class="text-lg font-bold mb-4">Submit task</h3>
        <input type="text" x-model="url" placeholder="YouTube channel or playlist URL" class="w-full px-3 py-2 border border-gray-300 rounded mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <button @click="submitTask(url)" :disabled="loading" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 disabled:opacity-50 transition">
            <span x-text="loading?'Submitting...':'Start download'"></span>
        </button>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-bold mb-4">Recent tasks</h3>
        <div id="tl" class="space-y-2"><p class="text-gray-400 text-sm">Loading...</p></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function submitTask(url) {
    if(!url) return showToast('Enter URL','error');
    const response = await csrfFetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
    const data = await response.json();
    if(!response.ok){showToast(data.detail,'error');return;}
    showToast('Task submitted','success');
    setTimeout(()=>location.href=`/task/${data.task_id}`, 1000);
}
async function loadTasks() {
    const response = await fetch('/api/tasks');
    if(!response.ok) return;
    const tasks = await response.json();
    const el = document.getElementById('tl');
    if(tasks.length === 0){ el.innerHTML = '<p class="text-gray-400 text-sm">No tasks</p>'; return; }
    el.innerHTML = tasks.slice(0,5).map(task => `<a href="/task/${task.id}" class="flex justify-between items-center p-3 border-b hover:bg-gray-50">
        <span class="truncate max-w-xs text-sm">${escapeHtml(task.youtube_url)}</span>
        <span class="text-xs px-2 py-1 rounded ${task.status==='completed'?'bg-green-100 text-green-700':task.status==='failed'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${escapeHtml(task.status)}</span>
    </a>`).join('');
}
loadBalance(); loadTasks();
</script>
{% endblock %}
