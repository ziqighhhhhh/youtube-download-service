{% extends "base.html" %}
{% block title %}控制台{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6 flex justify-between items-center">
        <div>
            <span class="text-sm text-gray-500">可用下载次数</span>
            <div id="balance" class="text-3xl font-bold text-blue-600">-</div>
        </div>
        <button onclick="location.href='/account'" class="px-4 py-2 border border-blue-600 text-blue-600 rounded hover:bg-blue-50 transition">充值</button>
    </div>

    <div class="bg-white rounded-lg shadow p-6" x-data="{url:'',loading:false}">
        <h3 class="text-lg font-bold mb-4">提交新任务</h3>
        <input type="text" x-model="url" placeholder="YouTube 频道或播放列表 URL" class="w-full px-3 py-2 border border-gray-300 rounded mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <button @click="submitTask(url)" :disabled="loading" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 disabled:opacity-50 transition">
            <span x-text="loading?'提交中...':'开始下载'"></span>
        </button>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-bold mb-4">最近任务</h3>
        <div id="tl" class="space-y-2"><p class="text-gray-400 text-sm">加载中...</p></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function submitTask(url) {
    if(!url) return showToast('请输入 URL','error');
    const r = await fetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url})});
    const d = await r.json();
    if(!r.ok){showToast(d.detail,'error');return;}
    showToast('任务已提交','success');
    setTimeout(()=>location.href=`/task/${d.task_id}`, 1000);
}
async function loadTasks() {
    const r = await fetch('/api/tasks');
    if(!r.ok) return;
    const ts = await r.json();
    const el = document.getElementById('tl');
    if(ts.length === 0){ el.innerHTML = '<p class="text-gray-400 text-sm">暂无任务</p>'; return; }
    el.innerHTML = ts.slice(0,5).map(t => `<a href="/task/${t.id}" class="flex justify-between items-center p-3 border-b hover:bg-gray-50">
        <span class="truncate max-w-xs text-sm">${t.youtube_url}</span>
        <span class="text-xs px-2 py-1 rounded ${t.status==='completed'?'bg-green-100 text-green-700':t.status==='failed'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${t.status}</span>
    </a>`).join('');
}
loadBalance(); loadTasks();
</script>
{% endblock %}
