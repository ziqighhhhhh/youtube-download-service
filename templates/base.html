<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YouTube Batch Downloader{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/custom.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
{% if request.session.get('user_id') %}
<nav class="bg-white shadow-sm">
    <div class="container mx-auto px-4 max-w-4xl flex justify-between items-center h-16">
        <a href="/" class="text-xl font-bold text-gray-800">YT Downloader</a>
        <div class="flex items-center space-x-4 text-sm">
            <a href="/" class="text-gray-600 hover:text-blue-600">Dashboard</a>
            <a href="/history" class="text-gray-600 hover:text-blue-600">History</a>
            <a href="/account" class="text-gray-600 hover:text-blue-600">Account</a>
            <a href="/bookmarklet" class="text-gray-600 hover:text-blue-600">Bookmarklet</a>
            <span class="text-blue-600 font-medium">Balance: <span id="nb">-</span></span>
            <button type="button" onclick="logout()" class="text-gray-500 hover:text-red-600">Logout</button>
        </div>
    </div>
</nav>
{% endif %}
<main class="container mx-auto px-4 py-8 max-w-4xl">
    {% block content %}{% endblock %}
</main>
<script>
const CSRF_TOKEN = "{{ request.session.get('csrf_token', '') }}";
function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function csrfFetch(url, options={}) {
    const headers = Object.assign({}, options.headers || {}, {'X-CSRF-Token': CSRF_TOKEN});
    return fetch(url, Object.assign({}, options, {headers}));
}
function showToast(message, type='info') {
    const node = document.createElement('div');
    node.className = `fixed top-4 right-4 px-4 py-2 rounded shadow text-white z-50 ${type==='error'?'bg-red-500':type==='success'?'bg-green-500':'bg-blue-500'}`;
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(()=>node.remove(), 3000);
}
async function loadBalance() {
    try {
        const response = await fetch('/api/billing/balance');
        if(response.ok){
            const data = await response.json();
            document.querySelectorAll('#nb,#balance').forEach(el=>el.textContent=data.balance);
        }
    } catch(e){}
}
async function logout() {
    await csrfFetch('/api/auth/logout', {method:'POST'});
    location.href = '/login';
}
if(document.getElementById('nb')) loadBalance();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
