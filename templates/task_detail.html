{% extends "base.html" %}
{% block title %}Task {{ task_id }}{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-start">
            <h2 class="text-xl font-bold">Task #{{ task_id }}</h2>
            <span id="statusBadge" class="px-2 py-1 text-sm rounded bg-yellow-100 text-yellow-700">downloading</span>
        </div>
        <div class="grid grid-cols-3 gap-4 mt-4 text-sm">
            <div><span class="text-gray-500">Total: </span><span id="totalVids" class="font-bold">-</span></div>
            <div><span class="text-gray-500">Cost: </span><span id="costVal" class="font-bold">-</span></div>
            <div><span class="text-gray-500">Success/failed: </span><span id="progress" class="font-bold">-</span></div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="font-bold mb-2">Realtime logs</h3>
        <div id="log" class="bg-gray-900 text-green-400 p-4 rounded h-96 overflow-y-auto font-mono text-sm space-y-0.5"></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const tid = {{ task_id }};
const proto = location.protocol==='https:'?'wss:':'ws:';
const ws = new WebSocket(`${proto}//${location.host}/api/tasks/ws/${tid}`);
ws.onmessage = event => {
    const log = document.getElementById('log');
    const line = document.createElement('div');
    line.textContent = event.data;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
};
ws.onerror = () => showToast('WebSocket failed','error');

setInterval(async ()=>{
    try {
        const response = await fetch(`/api/tasks/${tid}`);
        if(!response.ok) return;
        const task = await response.json();
        document.getElementById('totalVids').textContent = task.video_count_total;
        document.getElementById('costVal').textContent = task.cost;
        document.getElementById('progress').textContent = `${task.video_count_success}/${task.video_count_failed}`;
        const badge = document.getElementById('statusBadge');
        badge.textContent = task.status;
        badge.className = `px-2 py-1 text-sm rounded ${task.status==='completed'?'bg-green-100 text-green-700':task.status==='failed'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}`;
        if(task.status==='completed'||task.status==='failed'){
            ws.close();
        }
    } catch(e){}
}, 3000);
</script>
{% endblock %}
