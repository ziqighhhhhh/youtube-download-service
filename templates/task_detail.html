{% extends "base.html" %}
{% block title %}任务 {{ task_id }}{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-start">
            <h2 class="text-xl font-bold">任务 #{{ task_id }}</h2>
            <span id="statusBadge" class="px-2 py-1 text-sm rounded bg-yellow-100 text-yellow-700">下载中</span>
        </div>
        <div class="grid grid-cols-3 gap-4 mt-4 text-sm">
            <div><span class="text-gray-500">视频总数：</span><span id="totalVids" class="font-bold">-</span></div>
            <div><span class="text-gray-500">扣费次数：</span><span id="costVal" class="font-bold">-</span></div>
            <div><span class="text-gray-500">成功/失败：</span><span id="progress" class="font-bold">-</span></div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="font-bold mb-2">实时日志</h3>
        <div id="log" class="bg-gray-900 text-green-400 p-4 rounded h-96 overflow-y-auto font-mono text-sm space-y-0.5"></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const tid = {{ task_id }};
const proto = location.protocol==='https:'?'wss:':'ws:';
const ws = new WebSocket(`${proto}//${location.host}/api/ws/tasks/${tid}`);
ws.onmessage = e => {
    const d = document.getElementById('log');
    const p = document.createElement('div');
    p.textContent = e.data;
    d.appendChild(p);
    d.scrollTop = d.scrollHeight;
};
ws.onerror = () => showToast('WebSocket 连接失败','error');

setInterval(async ()=>{
    try {
        const r = await fetch(`/api/tasks/${tid}`);
        if(!r.ok) return;
        const t = await r.json();
        document.getElementById('totalVids').textContent = t.video_count_total;
        document.getElementById('costVal').textContent = t.cost;
        document.getElementById('progress').textContent = `${t.video_count_success}/${t.video_count_failed}`;
        const badge = document.getElementById('statusBadge');
        badge.textContent = t.status;
        badge.className = `px-2 py-1 text-sm rounded ${t.status==='completed'?'bg-green-100 text-green-700':t.status==='failed'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}`;
        if(t.status==='completed'||t.status==='failed'){
            ws.close();
            showToast('任务'+t.status, t.status==='completed'?'success':'error');
        }
    } catch(e){}
}, 3000);
</script>
{% endblock %}
