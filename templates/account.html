{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">YouTube cookies</h2>
        <textarea id="ct" rows="8" placeholder="Paste Netscape cookies.txt content" class="w-full px-3 py-2 border border-gray-300 rounded mb-4 font-mono text-sm"></textarea>
        <button onclick="saveCookie()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Save cookies</button>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">Recharge request</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input id="amt" type="number" min="1" step="1" placeholder="Amount" class="px-3 py-2 border border-gray-300 rounded">
            <input id="note" type="text" maxlength="500" placeholder="Note" class="px-3 py-2 border border-gray-300 rounded">
        </div>
        <button onclick="requestRecharge()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Submit request</button>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function saveCookie() {
    const response = await csrfFetch('/api/cookie', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cookie_text:document.getElementById('ct').value})});
    const data = await response.json();
    showToast(response.ok ? data.message : data.detail, response.ok ? 'success' : 'error');
}
async function requestRecharge() {
    const response = await csrfFetch('/api/billing/recharge-request', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount:parseFloat(document.getElementById('amt').value)||0, note:document.getElementById('note').value})});
    const data = await response.json();
    showToast(response.ok ? data.message : data.detail, response.ok ? 'success' : 'error');
}
</script>
{% endblock %}
