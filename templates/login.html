{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <form id="lf" class="bg-white rounded-lg shadow-md p-8 w-full max-w-md space-y-4">
        <h2 class="text-2xl font-bold text-center">登录</h2>
        <input type="email" id="em" placeholder="邮箱" required class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="password" id="pw" placeholder="密码" required class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">登录</button>
        <p class="text-center text-sm text-gray-600">没有账号？ <a href="/register" class="text-blue-600 hover:underline">注册</a></p>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const r = await csrfFetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:document.getElementById('em').value, password:document.getElementById('pw').value})});
    const d = await r.json();
    if(!r.ok){showToast(d.detail,'error');return;}
    showToast('登录成功','success');
    setTimeout(()=>location.href='/',500);
};
</script>
{% endblock %}
