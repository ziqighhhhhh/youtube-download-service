{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="font-bold mb-4">Users</h3>
        <div id="ul"><p class="text-gray-400 text-sm">Loading...</p></div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="font-bold mb-4">Tasks</h3>
        <div id="tk"><p class="text-gray-400 text-sm">Loading...</p></div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function loadAdmin(){
    try {
        const [userResponse, taskResponse] = await Promise.all([fetch('/api/admin/users'), fetch('/api/admin/tasks')]);
        if(userResponse.ok){
            const users = await userResponse.json();
            document.getElementById('ul').innerHTML = users.map(user=>`<div class="p-3 border-b flex justify-between items-center">
                <span>${escapeHtml(user.email)}</span>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500">Balance: ${escapeHtml(user.balance)}</span>
                    <button onclick="recharge(${user.id})" class="text-blue-600 text-sm hover:underline">Recharge</button>
                </div>
            </div>`).join('');
        }
        if(taskResponse.ok){
            const tasks = await taskResponse.json();
            document.getElementById('tk').innerHTML = tasks.slice(0,20).map(task=>`<div class="p-3 border-b text-sm">
                <span class="text-gray-600">${escapeHtml(task.youtube_url)}</span>
                <span class="ml-2 ${task.status==='completed'?'text-green-600':task.status==='failed'?'text-red-600':'text-yellow-600'}">${escapeHtml(task.status)}</span>
                <span class="ml-2 text-gray-400">${escapeHtml(task.video_count_success)}/${escapeHtml(task.video_count_total)} | ${escapeHtml(task.cost)}</span>
            </div>`).join('');
        }
    } catch(e){ showToast('Load failed','error'); }
}

async function recharge(uid) {
    const amount = prompt('Amount:');
    if(!amount) return;
    const response = await csrfFetch(`/api/admin/users/${uid}/recharge`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({amount:parseFloat(amount)})});
    const data = await response.json();
    showToast(response.ok ? data.message : data.detail, response.ok ? 'success' : 'error');
    if(response.ok) loadAdmin();
}

loadAdmin();
</script>
{% endblock %}
