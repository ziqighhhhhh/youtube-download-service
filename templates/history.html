{% extends "base.html" %}
{% block title %}下载历史{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-xl font-bold mb-4">下载历史</h2>
    <div id="hl"><p class="text-gray-400 text-sm">加载中...</p></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
fetch('/api/tasks').then(r=>r.json()).then(ts=>{
    const el = document.getElementById('hl');
    if(ts.length===0){el.innerHTML='<p class="text-gray-400 text-sm">暂无记录</p>';return;}
    el.innerHTML = ts.map(t=>`<div class="p-4 border-b flex justify-between items-center hover:bg-gray-50">
        <a href="/task/${t.id}" class="truncate max-w-xs text-sm text-blue-600 hover:underline">${t.youtube_url}</a>
        <div class="text-sm text-right">
            <span class="px-2 py-1 rounded text-xs ${t.status==='completed'?'bg-green-100 text-green-700':t.status==='failed'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${t.status}</span>
            <span class="ml-2 text-gray-500">${t.video_count_success}/${t.video_count_total} | ${t.cost}次</span>
        </div>
    </div>`).join('');
}).catch(()=>document.getElementById('hl').textContent='加载失败');
</script>
{% endblock %}
