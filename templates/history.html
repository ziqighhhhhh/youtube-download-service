{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-xl font-bold mb-4">Download history</h2>
    <div id="hl"><p class="text-gray-400 text-sm">Loading...</p></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
fetch('/api/tasks').then(r=>r.json()).then(tasks=>{
    const el = document.getElementById('hl');
    if(tasks.length===0){el.innerHTML='<p class="text-gray-400 text-sm">No records</p>';return;}
    el.innerHTML = tasks.map(task=>`<div class="p-4 border-b flex justify-between items-center hover:bg-gray-50">
        <a href="/task/${task.id}" class="truncate max-w-xs text-sm text-blue-600 hover:underline">${escapeHtml(task.youtube_url)}</a>
        <div class="text-sm text-right">
            <span class="px-2 py-1 rounded text-xs ${task.status==='completed'?'bg-green-100 text-green-700':task.status==='failed'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${escapeHtml(task.status)}</span>
            <span class="ml-2 text-gray-500">${escapeHtml(task.video_count_success)}/${escapeHtml(task.video_count_total)} | ${escapeHtml(task.cost)}</span>
        </div>
    </div>`).join('');
}).catch(()=>document.getElementById('hl').textContent='Load failed');
</script>
{% endblock %}
